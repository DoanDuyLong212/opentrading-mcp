[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opentrading-mcp"
dynamic = ["version"]
description = "Shareable MCP-server for Vietnamese market research (team -> public)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.9,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10",
  "uvicorn>=0.30",
  "redis>=5.0",
  "psycopg[binary]>=3.1",
  "vnstock>=3.0",
  "yfinance>=0.2",
  "pandas>=2.0",
  "markdownify>=1.2.3",
  "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "mypy>=1.14",
  "pandas-stubs>=2.2",
]

[project.scripts]
opentrading-mcp = "opentrading_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opentrading_mcp"]

[tool.hatch.version]
path = "src/opentrading_mcp/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Long SQL strings and data tables from the cycle research port (PR #7).
"src/opentrading_mcp/tools/cycle_stats.py" = ["E501"]
"src/opentrading_mcp/tools/asset_cycle.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["opentrading_mcp"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["vnstock.*", "yfinance.*"]
ignore_missing_imports = true

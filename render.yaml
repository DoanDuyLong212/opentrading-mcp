# NOTE (10/10/2026, confirmed 14/10/2026 via Render API): only
# opentrading-mcp-web exists, on the FREE plan (0.1 CPU, sleeps after 15 min
# idle). Background workers need a paid plan, so the loops (DNSE WS, yfinance,
# heartbeat) run inside the web service instead — health `worker: ok` proves
# it. Redis/Postgres are external (Upstash + external PG); there is no managed
# database on Render. Keep this file matching reality: DO NOT re-add worker/
# database sections or raise the plan without explicit approval, as a Blueprint
# sync would create billable resources.
services:
  - type: web
    name: opentrading-mcp-web
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /healthz
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MCP_BEARER_TEAM
        sync: false
      - key: VIETSTOCK_EMAIL
        sync: false
      - key: VIETSTOCK_PASSWORD
        sync: false
      - key: DNSE_API_KEY
        sync: false
      - key: DNSE_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: VNSTOCK_API_KEY
        sync: false

name: opentrading-mcp

services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
      POSTGRES_DB: ${POSTGRES_DB:-mcp}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-mcp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mcp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-web:
    build: .
    container_name: mcp-web
    restart: unless-stopped
    command: ["opentrading-mcp", "serve", "--http", "--port", "8102"]
    ports:
      - "${MCP_PORT:-8102}:8102"
    environment:
      DATABASE_URL: postgresql://trading:trading@postgres:5432/mcp
      REDIS_URL: redis://redis:6379/0
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp-worker:
    build: .
    container_name: mcp-worker
    restart: unless-stopped
    command: ["python", "-m", "opentrading_mcp.loops"]
    environment:
      DATABASE_URL: postgresql://trading:trading@postgres:5432/mcp
      REDIS_URL: redis://redis:6379/0
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

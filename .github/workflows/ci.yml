name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR runs are cancelled: two quick pushes to main must each
  # finish, or a commit lands on main without a completed CI run (#99).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Cycle-table tests run against this throwaway database; nothing else uses it.
      TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/postgres
      # Same value as the Dockerfile: vnstock 6 reads 0 as "off".
      VNSTOCK_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests scripts
      # The full live matrix calls real upstreams (and needs their keys): run it by hand.
      - run: uv run pytest -q -p no:cacheprovider --deselect tests/contract/test_verify_matrix.py::test_full_matrix_stdio
